<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Incident Detail</title>
  <style>
    #view-section p { margin: 0.4rem 0; }
    #edit-section, #assign-personnel-section {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid;
      max-width: 400px;
    }
    #edit-section label, #assign-personnel-section label { display: block; margin-top: 0.5rem; }
    #edit-section input,
    #edit-section select,
    #edit-section textarea,
    #assign-personnel-section select { width: 100%; padding: 0.3rem; box-sizing: border-box; }
    button { padding: 0.5rem 1rem; margin-top: 1rem; margin-right: 0.5rem; cursor: pointer; }
    
    .personnel-section { margin-top: 2rem; border-top: 1px solid; padding-top: 1rem; }
    ul#assigned-personnel-list { padding-left: 1.2rem; }
  </style>
</head>
<body>
  <p><a href="/incidents.html">&larr; Back to Incidents</a></p>

  <div id="incident-detail">
    <div id="view-section">
      <h1 id="detail-title"></h1>
      <p><strong>Description:</strong> <span id="detail-description"></span></p>
      <p><strong>Location:</strong> <span id="detail-location"></span></p>
      <p><strong>Severity:</strong> <span id="detail-severity"></span></p>
      <p><strong>Status:</strong> <span id="detail-status"></span></p>
      <p><strong>Created:</strong> <span id="detail-created"></span></p>

      <button id="edit-btn">Edit</button>
      <button id="resolve-btn">Mark Resolved</button>
      <button id="assign-btn">+ Assign Personnel</button>

      <div class="personnel-section">
        <h3>Assigned Personnel</h3>
        <ul id="assigned-personnel-list">
          <!-- js -->
        </ul>
      </div>
    </div>

    <div id="assign-personnel-section">
      <h2>Assign Personnel</h2>
      <form id="assign-personnel-form">
        <label for="personnel-select">Select Available Personnel</label>
        <select id="personnel-select" required>
          <option value="">-- Select Personnel --</option>
          <!-- js -->
        </select>

        <button type="submit">Assign to Incident</button>
      </form>
    </div>

    <div id="edit-section">
      <h2>Edit Incident</h2>
      <form id="edit-form">
        <label for="edit-title">Title</label>
        <input type="text" id="edit-title" required>

        <label for="edit-description">Description</label>
        <textarea id="edit-description" required></textarea>

        <label for="edit-location">Location</label>
        <input type="text" id="edit-location" required>

        <label for="edit-severity">Severity</label>
        <select id="edit-severity">
          <option value="LOW">LOW</option>
          <option value="MEDIUM">MEDIUM</option>
          <option value="HIGH">HIGH</option>
        </select>

        <button type="submit">Save Changes</button>
      </form>
    </div>
  </div>

  <script src="/static/js/sidebar.js"></script>
  <script src="/static/js/incidents.js"></script>
</body>
</html>
