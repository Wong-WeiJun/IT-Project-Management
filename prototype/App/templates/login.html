<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign in</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 360px; margin: 3rem auto; }
    label { display: block; margin-top: 0.5rem; }
    input { width: 100%; padding: 0.3rem; box-sizing: border-box; }
    button { padding: 0.5rem 1rem; margin-top: 1rem; cursor: pointer; }
    .error { margin-top: 1rem; }
    .accounts { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Emergency Support Coordination System</h1>
  <p>Sign in to continue.</p>

  <p id="login-error" class="error" hidden>Username or password is incorrect.</p>

  <form method="post" action="/login">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button type="submit">Sign in</button>
  </form>

  <div class="accounts">
    <p>Hard-coded accounts for this prototype:</p>
    <p>Admin: <code>admin</code> / <code>admin</code></p>
    <p>Standard: <code>standard</code> / <code>standard</code></p>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get("error")) {
      document.getElementById("login-error").hidden = false;
    }
  </script>
</body>
</html>
